# LOG-10547 benchmark: VRL baseline.
# The level-detection program is the exact VRL emitted by the CLO's viaq
# filter (see cluster-logging-operator generated configs), adapted only to
# read .message and write .level (the real pipeline reads/writes them under
# ._internal, which does not change evaluation cost).
data_dir = "/var/lib/vector/bench"

[sources.in]
type = "file"
include = ["/bench/corpus/*.log"]
read_from = "beginning"
glob_minimum_cooldown_ms = 1000
max_line_bytes = 104857600
ignore_checkpoints = true

[transforms.lvl]
type = "remap"
inputs = ["in"]
source = '''
if !exists(.level) {
  level = null
  message = .message

  # attempt 1: parse as logfmt (e.g. level=error msg="Failed to connect")
  parsed_logfmt, err = parse_logfmt(message)
  if err == null && is_string(parsed_logfmt.level) {
    level = downcase!(parsed_logfmt.level)
  }

  # attempt 2: parse as klog
  if level == null {
    parsed_klog, err = parse_klog(message)
    if err == null && is_string(parsed_klog.level) {
      level = parsed_klog.level
    }
  }

  # attempt 3: groks template for classic text logs
  if level == null {
    parsed_grok, err = parse_groks(
      message,
      patterns: [
        "%{common_prefix} %{_message}"
      ],
      aliases: {
        "common_prefix": "%{_timestamp} %{_loglevel}",
        "_timestamp": "%{TIMESTAMP_ISO8601:timestamp}",
        "_loglevel": "%{LOGLEVEL:level}",
        "_message": "%{GREEDYDATA:message}"
      }
    )
    if err == null && is_string(parsed_grok.level) {
      level = downcase!(parsed_grok.level)
    }
  }

  if level == null {
    level = "default"

    # attempt 4: well known structured patterns
    if match!(message, r'^EM[0-9]+|(?i:level=emergency|Value:emergency|"level":"emergency")') {
      level = "emergency"
    } else if match!(message, r'^A[0-9]+|(?i:level=alert|Value:alert|"level":"alert")') {
      level = "alert"
    } else if match!(message, r'^C[0-9]+|(?i:level=critical|Value:critical|"level":"critical")') {
      level = "critical"
    } else if match!(message, r'^E[0-9]+|(?i:level=error|Value:error|"level":"error")') {
      level = "error"
    } else if match!(message, r'^W[0-9]+|(?i:level=warn|Value:warn|"level":"warn")') {
      level = "warn"
    } else if match!(message, r'^N[0-9]+|(?i:level=notice|Value:notice|"level":"notice")') {
      level = "notice"
    } else if match!(message, r'^I[0-9]+|(?i:level=info|Value:info|"level":"info")') {
      level = "info"
    } else if match!(message, r'^D[0-9]+|(?i:level=debug|Value:debug|"level":"debug")') {
      level = "debug"
    } else if match!(message, r'^T[0-9]+|(?i:level=trace|Value:trace|"level":"trace")') {
      level = "trace"
    }

    # attempt 5: keyword that appears earliest in the message
    if level == "default" {
      level_patterns = r'(?i)(?<emergency>emergency|<emergency>)|(?<alert>alert|<alert>)|(?<critical>critical|<critical>)|(?<error>error|<error>)|(?<warn>warn(?:ing)?|<warn>)|(?<notice>notice|<notice>)|(?:\b(?<info>info)\b|<info>)|(?<debug>debug|<debug>)|(?<trace>trace|<trace>)'
      parsed, err = parse_regex(message, level_patterns)
      if err == null {
        if is_string(parsed.emergency) {
          level = "emergency"
        } else if is_string(parsed.alert) {
          level = "alert"
        } else if is_string(parsed.critical) {
          level = "critical"
        } else if is_string(parsed.error) {
          level = "error"
        } else if is_string(parsed.warn) {
          level = "warn"
        } else if is_string(parsed.notice) {
          level = "notice"
        } else if is_string(parsed.info) {
          level = "info"
        } else if is_string(parsed.debug) {
          level = "debug"
        } else if is_string(parsed.trace) {
          level = "trace"
        }
      }
    }
  }
  .level = level
}
'''

[sinks.out]
type = "file"
inputs = ["lvl"]
path = "/bench/out/result.log"
encoding.codec = "json"

[sinks.out.buffer]
type = "memory"
max_events = 100000
